%YAML:1.0
---
cameras:
  # The physical IMX219 modules are installed upside down. Rotate in NVMM
  # before every downstream consumer so world direction is consistent.
  - { sensor_id: 0, width: 1280, height: 720, fps: 30, rotate_180: 1 }
  - { sensor_id: 1, width: 1280, height: 720, fps: 30, rotate_180: 1 }

runtime:
  show_window: 1
  # Fixed preview panels prevent asynchronous cameras from changing the mosaic layout.
  preview_tile_width: 800
  preview_tile_height: 450
  inference_interval: 4
  event_log: "runtime/seat-events.jsonl"

detector:
  # `tensorrt` is the deployed path. Use `opencv` only for model/debug validation.
  backend: "tensorrt"
  onnx_model: "models/yolov8n.onnx"
  engine: "models/yolov8n_fp16_orin.engine"
  input_width: 640
  input_height: 640
  confidence_threshold: 0.35
  nms_threshold: 0.45
  # Taxonomy is deployment data, not code. Replace this list alongside a custom model.
  labels: ["person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket", "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"]

semantics:
  people_labels: ["person"]
  seat_labels: ["chair", "bench", "couch"]
  # Everything else from the model is dynamically treated as a possible object on a seat.
  ignored_labels: ["dining table"]

reasoner:
  minimum_seat_track_age: 12
  track_ttl_frames: 45
  association_iou: 0.25
  occupied_confirmation_ms: 700
  claimed_confirmation_ms: 1200
  available_confirmation_ms: 2500
